<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ritmica Chile - Orden de Paso</title>
    <meta
      name="description"
      content="Orden de paso de gimnastas con puntajes y notas en tiempo real"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hero">
      <p class="kicker">Ritmica Chile 2026</p>
      <h1>Orden de Paso</h1>
      <p class="subtitle">Puntajes y notas sincronizadas en vivo</p>
    </header>

    <main class="container">
      <section class="tabs" aria-label="Seleccion de vista">
        <button class="tab is-active" data-view="orden" type="button">Orden</button>
        <button class="tab" data-view="ranking" type="button">Lugares</button>
      </section>

      <section id="ordenFilters" class="filters" aria-label="Filtros orden">
        <label>
          Dia
          <select id="ordenDay">
            <option value="sabado">Sabado</option>
            <option value="domingo">Domingo</option>
          </select>
        </label>
        <label>
          Club
          <select id="ordenClub">
            <option value="todos">Todos</option>
          </select>
        </label>
        <label class="filter-wide">
          Buscar
          <input id="ordenSearch" type="text" placeholder="Nombre, club o categoria" />
        </label>
      </section>

      <section id="rankingFilters" class="filters hidden" aria-label="Filtros ranking">
        <label>
          Dia
          <select id="rankingDay">
            <option value="todos">Todos</option>
            <option value="sabado">Sabado</option>
            <option value="domingo">Domingo</option>
          </select>
        </label>
        <label>
          Club
          <select id="rankingClub">
            <option value="todos">Todos</option>
          </select>
        </label>
        <label>
          Categoria
          <select id="rankingCategory">
            <option value="todos">Todas</option>
          </select>
        </label>
      </section>

      <section class="statusbar">
        <span id="eventName">Fecha Sur 1 - 2026</span>
        <span id="syncStatus">Conectando...</span>
      </section>

      <section id="list" class="list" aria-live="polite"></section>
      <section id="rankingList" class="ranking-list hidden" aria-live="polite"></section>
    </main>

    <template id="itemTemplate">
      <article class="card">
        <div class="row top">
          <p class="chip"></p>
          <p class="category"></p>
        </div>
        <h2 class="name"></h2>
        <p class="meta"></p>

        <div class="score-row">
          <label>Puntaje</label>
          <input class="score-input" inputmode="decimal" type="text" placeholder="0.00" />
        </div>

        <label class="passed-row">
          <input class="passed-input" type="checkbox" />
          <span>Ya paso</span>
        </label>

        <details class="notes-wrap">
          <summary>Notas</summary>
          <textarea class="notes-input" rows="3" placeholder="Agregar observaciones..."></textarea>
        </details>
      </article>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
